<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>ButchersGames-TestTask</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            font-family: Arial, sans-serif;
        }

        .game {
            position: relative;
            width: min(100vw, calc(100vh * 9 / 20));
            width: min(100vw, calc(100dvh * 9 / 20));
            aspect-ratio: 9 / 20;
            overflow: hidden;
        }

        .game iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: black;
        }

        .play-button {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 4px solid white;
            padding: 30px 60px;
            font-size: 32px;
            cursor: pointer;
            border-radius: 16px;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .play-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .play-button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
<div class="game" id="game">
    <div class="overlay" id="overlay">
        <button class="play-button" onclick="play()">Play</button>
    </div>
</div>

<script>
    // The iframe is created on click so the user gesture unlocks audio (FMOD / WebAudio).
    function play() {
        const iframe = document.createElement('iframe');
        iframe.src = 'Build/index.html';
        iframe.scrolling = 'no';
        iframe.allow = 'autoplay; fullscreen';

        document.getElementById('game').appendChild(iframe);
        document.getElementById('overlay').remove();
        iframe.focus();
    }
</script>
</body>
</html>
