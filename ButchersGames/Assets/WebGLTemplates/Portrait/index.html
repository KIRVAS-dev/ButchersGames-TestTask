<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: Arial, sans-serif;
        }

        #stage {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Mouse as the primary pointer (desktop): portrait column over the full height. */
        @media (pointer: fine) {
            #game {
                width: min(100%, calc(100vh * 9 / 19.5));
                width: min(100%, calc(100dvh * 9 / 19.5));
            }
        }

        #unity-canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
            background: black;
        }

        #overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: black;
        }

        #play-button {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 4px solid white;
            padding: 30px 60px;
            font-size: 32px;
            cursor: pointer;
            border-radius: 16px;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        #play-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        #play-button:active {
            transform: scale(0.95);
        }

        #progress {
            display: none;
            width: 60%;
            height: 12px;
            border: 2px solid white;
            border-radius: 8px;
            overflow: hidden;
        }

        #progress-fill {
            width: 0;
            height: 100%;
            background: white;
        }
    </style>
</head>
<body>
<div id="stage">
    <div id="game">
        <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
        <div id="overlay">
            <button id="play-button">Play</button>
            <div id="progress"><div id="progress-fill"></div></div>
        </div>
    </div>
</div>

<script src="Build/{{{ LOADER_FILENAME }}}"></script>
<script>
    var stage = document.querySelector("#stage");
    var canvas = document.querySelector("#unity-canvas");
    var overlay = document.querySelector("#overlay");
    var playButton = document.querySelector("#play-button");
    var progress = document.querySelector("#progress");
    var progressFill = document.querySelector("#progress-fill");
    var isStarted = false;

    // The game starts on click so the user gesture unlocks audio (FMOD / WebAudio).
    playButton.addEventListener("click", function () {
        playButton.style.display = "none";
        progress.style.display = "block";

        if (window.matchMedia("(pointer: coarse)").matches) {
            enterFullscreenPortrait();
        }

        createUnityInstance(canvas, {
            arguments: [],
            dataUrl: "Build/{{{ DATA_FILENAME }}}",
            frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
            codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
            symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
            streamingAssetsUrl: "StreamingAssets",
            companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
            productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
            productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        }, function (value) {
            progressFill.style.width = 100 * value + "%";
        }).then(function () {
            overlay.remove();
            isStarted = true;
            canvas.focus();
        }).catch(function (message) {
            alert(message);
        });
    });

    function enterFullscreenPortrait() {
        var root = document.documentElement;

        if (!root.requestFullscreen) {
            return;
        }

        root.requestFullscreen().then(function () {
            if (screen.orientation && screen.orientation.lock) {
                return screen.orientation.lock("portrait");
            }
        }).catch(function () {
        });
    }

    // Keeps the drag alive when the cursor leaves the canvas.
    canvas.addEventListener("pointerdown", function (event) {
        canvas.setPointerCapture(event.pointerId);
    });

    // A press on the side bars is replayed on the canvas, so the drag controls the game from there too.
    stage.addEventListener("pointerdown", function (event) {
        if (!isStarted || event.target === canvas) {
            return;
        }

        canvas.dispatchEvent(new PointerEvent("pointerdown", event));
        canvas.dispatchEvent(new MouseEvent("mousedown", event));
        canvas.setPointerCapture(event.pointerId);
        canvas.focus();
    });
</script>
</body>
</html>
